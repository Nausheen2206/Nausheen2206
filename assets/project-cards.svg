<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .card { animation: cardSlide 0.8s ease-out backwards; }
      .card:nth-child(1) { animation-delay: 0s; }
      .card:nth-child(2) { animation-delay: 0.2s; }
      .card:nth-child(3) { animation-delay: 0.4s; }
      @keyframes cardSlide {
        from { transform: translateY(30px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .card-bg { fill: #161B22; stroke: #30363d; stroke-width: 2; rx: 12; }
      .card-text { font-family: 'Jetbrains Mono'; fill: #E6EDF3; }
      .card-title { font-size: 16px; font-weight: bold; fill: #A855F7; }
      .card-tag { font-size: 10px; fill: #8B5CF6; background: #1C2128; }
    </style>
  </defs>

  <rect width="1200" height="400" fill="#0d1117"/>

  <!-- Card 1 -->
  <g class="card">
    <rect class="card-bg" x="20" y="20" width="350" height="360"/>
    <text class="card-title" x="40" y="60">📚 Course-in-LLMs</text>
    <text class="card-text" x="40" y="120" font-size="13">LLM Architecture</text>
    <text class="card-text" x="40" y="145" font-size="13">Fine-tuning &amp; Deployment</text>
    <rect class="card-bg" x="40" y="180" width="80" height="25" fill="#1C2128"/>
    <text class="card-tag" x="50" y="200">Python</text>
    <rect class="card-bg" x="140" y="180" width="100" height="25" fill="#1C2128"/>
    <text class="card-tag" x="150" y="200">PyTorch</text>
  </g>

  <!-- Card 2 -->
  <g class="card">
    <rect class="card-bg" x="425" y="20" width="350" height="360"/>
    <text class="card-title" x="445" y="60">🔥 Network Firewall</text>
    <text class="card-text" x="445" y="120" font-size="13">Packet Filtering Engine</text>
    <text class="card-text" x="445" y="145" font-size="13">Rule-based Security System</text>
    <rect class="card-bg" x="445" y="180" width="80" height="25" fill="#1C2128"/>
    <text class="card-tag" x="455" y="200">C++</text>
    <rect class="card-bg" x="545" y="180" width="110" height="25" fill="#1C2128"/>
    <text class="card-tag" x="555" y="200">Networking</text>
  </g>

  <!-- Card 3 -->
  <g class="card">
    <rect class="card-bg" x="830" y="20" width="350" height="360"/>
    <text class="card-title" x="850" y="60">🔍 Plagiarism Detector</text>
    <text class="card-text" x="850" y="120" font-size="13">AST-based Code Analysis</text>
    <text class="card-text" x="850" y="145" font-size="13">95%+ Detection Accuracy</text>
    <rect class="card-bg" x="850" y="180" width="80" height="25" fill="#1C2128"/>
    <text class="card-tag" x="860" y="200">Python</text>
    <rect class="card-bg" x="950" y="180" width="100" height="25" fill="#1C2128"/>
    <text class="card-tag" x="960" y="200">ML/NLP</text>
  </g>
</svg>