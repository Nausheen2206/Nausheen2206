<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-labelledby="title description">
  <title id="title">Code Plagiarism Detector project card</title>
  <desc id="description">Compares C++ source using rolling hashes, tries, and graph similarity to identify shared code patterns.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="640" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#151D2B"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="640" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F472B6" stop-opacity=".72"/>
      <stop offset="1" stop-color="#334155" stop-opacity=".7"/>
    </linearGradient>
    <style>
      .title { fill: #F1F5F9; font: 600 19px 'Segoe UI', Arial, sans-serif; }
      .copy { fill: #AAB7C8; font: 13px 'Segoe UI', Arial, sans-serif; }
      .tag { fill: #D8E1EC; font: 11px 'Segoe UI', Arial, sans-serif; }
      .meta { fill: #78879A; font: 10px 'Segoe UI', Arial, sans-serif; letter-spacing: 1.4px; }
      .action { fill: #F472B6; font: 600 11px 'Segoe UI', Arial, sans-serif; letter-spacing: 1px; }
      .card-surface { transition: stroke .2s ease, fill .2s ease; }
      svg:hover .card-surface { stroke: #F472B6; }
    </style>
  </defs>
  <rect class="card-surface" x="1" y="1" width="638" height="278" rx="18" fill="url(#surface)" stroke="url(#edge)" stroke-width="1.5"/>
  <path d="M520 1h100a18 18 0 0 1 18 18v92c-45-13-88-44-118-110Z" fill="#F472B6" opacity=".055"/>
  <rect x="24" y="24" width="48" height="48" rx="14" fill="#F472B6" fill-opacity=".12" stroke="#F472B6" stroke-opacity=".35"/>
  <g transform="translate(36 36)" fill="none" stroke="#F472B6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m8 7-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/>
  </g>
  <text x="90" y="35" class="meta">SELECTED PROJECT  /  03</text>
  <text x="90" y="61" class="title">Code Plagiarism Detector</text>
  <path d="M28 91h584" stroke="#263244"/>
  <text x="28" y="119" class="copy">Compares C++ source using rolling hashes, tries, and graph</text>
  <text x="28" y="140" class="copy">similarity to identify shared code patterns.</text>
  <text x="28" y="163" class="meta">TECH STACK</text>
  <g><rect x="28" y="176" width="54" height="24" rx="12" fill="#202938" stroke="#364152"/><circle cx="40" cy="188" r="3" fill="#F472B6"/><text x="49" y="192" class="tag">C++</text></g><g><rect x="90" y="176" width="108" height="24" rx="12" fill="#202938" stroke="#364152"/><circle cx="102" cy="188" r="3" fill="#F472B6"/><text x="111" y="192" class="tag">Rolling Hash</text></g><g><rect x="206" y="176" width="54" height="24" rx="12" fill="#202938" stroke="#364152"/><circle cx="218" cy="188" r="3" fill="#F472B6"/><text x="227" y="192" class="tag">Trie</text></g><g><rect x="268" y="176" width="136" height="24" rx="12" fill="#202938" stroke="#364152"/><circle cx="280" cy="188" r="3" fill="#F472B6"/><text x="289" y="192" class="tag">Graph Similarity</text></g>
  <path d="M28 235h584" stroke="#263244"/>
  <text x="28" y="258" class="action">OPEN REPOSITORY</text>
  <path d="M151 254h22m-7-7 7 7-7 7" fill="none" stroke="#F472B6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="603" cy="253" r="3" fill="#F472B6" opacity=".8"/>
</svg>
